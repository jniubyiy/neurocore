[package]
name = "neurocore"
version = "0.1.0"
edition = "2021"

[dependencies]
once_cell = "1.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

vulkano = "0.35.2"
gpu-allocator = "0.28.0"

[dev-dependencies]
faer = { version = "0.24.0", default-features = false, features = ["std"] }

[features]
default = []
gpu = []
# v2: изолированная новая архитектура (jobs_v2, operators_v2,
# distributor_v2, graph_v2, execute_v2). Пока фича выключена,
# соответствующие файлы не компилируются, старый путь работает
# без изменений. См. NEUROCORE V2 — АРХИТЕКТУРНАЯ КАРТА.
v2 = []

[[example]]
name = "mnist_binary_32x32"
path = "examples_large/mnist_binary_32x32.rs"

[[example]]
name = "v2_smoke"
path = "examples/v2_smoke.rs"
required-features = ["v2"]